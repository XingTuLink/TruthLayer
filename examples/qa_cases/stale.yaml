# StaleDetector golden cases (#20).
# 三层严格分离：来源年龄(仅信息) / possibly_stale(超龄启发式, 低置信) /
# confirmed_stale(valid_to 过期或被新版显式取代, 确定性)。
# 文档老 ≠ 知识老：没有任何年龄信号的事实绝不猜过期。
cases:
  # ---- Positive：confirmed_stale ----------------------------------------
  - id: stale_confirmed_valid_to_expired
    title: 事实有效期已结束（valid_to 早于评估日）
    category: positive
    documents:
      - {id: d1, filename: 2024休假政策.md, source_type: policy}
    entities:
      - {id: b1, name: 年假政策, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: annual_leave_days, value: 5, value_type: number, source: d1, valid_to: 2025-12-31}
    expected_drifts:
      - {type: confirmed_stale, subject: b1, predicate: annual_leave_days, severity: medium}

  - id: stale_confirmed_superseding_source
    title: 来源文档已被更新版本显式取代（同时产生文档级 superseded）
    category: positive
    documents:
      - {id: dold, filename: 产品价格表_2025.csv, source_type: pricing}
      - {id: dnew, filename: 产品价格表_2026.csv, source_type: pricing, previous_version_of: dold}
    entities:
      - {id: p1, name: 标准版套餐, type: product}
    facts:
      - {id: f1, subject: p1, predicate: list_price, value: 100, value_type: number, source: dold}
    expected_drifts:
      - {type: confirmed_stale, subject: p1, predicate: list_price, severity: medium, old_source: 产品价格表_2025.csv, new_source: 产品价格表_2026.csv}
      - {type: superseded, severity: medium, old_source: 产品价格表_2025.csv, new_source: 产品价格表_2026.csv}

  - id: stale_confirmed_both_signals
    title: 有效期已过且来源被新版取代，两个确定性信号叠加
    category: positive
    documents:
      - {id: dold, filename: 差旅制度_v1.md, source_type: policy}
      - {id: dnew, filename: 差旅制度_v2.md, source_type: policy, previous_version_of: dold}
    entities:
      - {id: t1, name: 差旅住宿标准, type: policy}
    facts:
      - {id: f1, subject: t1, predicate: hotel_cap_cny, value: 300, value_type: number, source: dold, valid_to: 2025-06-30}
    expected_drifts:
      - {type: confirmed_stale, subject: t1, predicate: hotel_cap_cny, severity: medium}
      - {type: superseded, severity: medium, old_source: 差旅制度_v1.md, new_source: 差旅制度_v2.md}

  - id: stale_confirmed_pricing_critical
    title: 价格类事实过期按配置升级为严重级
    category: positive
    rules:
      severity: {pricing_change: critical}
    documents:
      - {id: d1, filename: 2024价格表.csv, source_type: pricing}
    entities:
      - {id: p1, name: 增值服务包, type: product}
    facts:
      - {id: f1, subject: p1, predicate: addon_price, value: 50, value_type: number, source: d1, valid_to: 2025-10-01}
    expected_drifts:
      - {type: confirmed_stale, subject: p1, predicate: addon_price, severity: critical}

  - id: stale_confirmed_policy_override_high
    title: 制度类过期按配置升级为高级
    category: positive
    rules:
      severity: {policy_change: high}
    documents:
      - {id: d1, filename: 旧考勤制度.md, source_type: policy}
    entities:
      - {id: b1, name: 弹性考勤制度, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: core_hours, value: 09:00-18:00, value_type: string, source: d1, valid_to: 2025-03-31}
    expected_drifts:
      - {type: confirmed_stale, subject: b1, predicate: core_hours, severity: high}

  - id: stale_confirmed_aged_and_superseded_not_possibly
    title: 超龄且被取代时只报 confirmed，不再重复报 possibly（三层不重叠）
    category: positive
    documents:
      - {id: dold, filename: 会员权益_2024.md, source_type: policy}
      - {id: dnew, filename: 会员权益_2026.md, source_type: policy, previous_version_of: dold}
    entities:
      - {id: m1, name: 银卡会员, type: tier}
    facts:
      - {id: f1, subject: m1, predicate: point_multiplier, value: 1.2, value_type: number, source: dold, observed_at: 2024-03-01}
    expected_drifts:
      - {type: confirmed_stale, subject: m1, predicate: point_multiplier, severity: medium}
      - {type: superseded, severity: medium, old_source: 会员权益_2024.md, new_source: 会员权益_2026.md}

  # ---- Positive：possibly_stale（仅超龄启发式） ---------------------------
  - id: stale_possibly_observed_over_threshold
    title: 观测时间超过默认 365 天阈值，疑似过期
    category: positive
    documents:
      - {id: d1, filename: 设备维保说明.md, source_type: general}
    entities:
      - {id: eq1, name: 空调机组A, type: equipment}
    facts:
      - {id: f1, subject: eq1, predicate: maintenance_cycle_months, value: 6, value_type: number, source: d1, observed_at: 2025-05-01}
    expected_drifts:
      - {type: possibly_stale, subject: eq1, predicate: maintenance_cycle_months, severity: warning}

  - id: stale_possibly_valid_from_over_threshold
    title: 无观测时间时以生效时间计龄，超阈值疑似过期
    category: positive
    documents:
      - {id: d1, filename: 老旧操作手册.md, source_type: general}
    entities:
      - {id: eq1, name: 锅炉B2, type: equipment}
    facts:
      - {id: f1, subject: eq1, predicate: safety_valve_model, value: SV-100, value_type: string, source: d1, valid_from: 2024-06-01}
    expected_drifts:
      - {type: possibly_stale, subject: eq1, predicate: safety_valve_model, severity: warning}

  - id: stale_possibly_pricing_shorter_threshold
    title: 价格来源用更短的 pricing 阈值（90 天），120 天即疑似
    category: positive
    rules:
      pricing_stale_days: 90
    documents:
      - {id: d1, filename: 季度价格表.csv, source_type: pricing}
    entities:
      - {id: p1, name: 季节性促销位, type: product}
    facts:
      - {id: f1, subject: p1, predicate: promo_price, value: 19.9, value_type: number, source: d1, observed_at: 2026-02-01}
    expected_drifts:
      - {type: possibly_stale, subject: p1, predicate: promo_price, severity: warning}

  - id: stale_possibly_custom_threshold
    title: 自定义 30 天阈值，61 天未复核即疑似
    category: positive
    rules:
      stale_after_days: 30
    documents:
      - {id: d1, filename: 促销活动页.md, source_type: general}
    entities:
      - {id: c1, name: 春季大促, type: campaign}
    facts:
      - {id: f1, subject: c1, predicate: discount_rate, value: 0.8, value_type: number, source: d1, observed_at: 2026-04-01}
    expected_drifts:
      - {type: possibly_stale, subject: c1, predicate: discount_rate, severity: warning}

  - id: stale_possibly_standalone_policy_over_threshold
    title: 独立（不属于版本链）的现行制度长期未复核仍应报疑似，不被“现行版本”规则抑制
    category: positive
    as_of: 2026-10-06
    documents:
      - {id: d1, filename: 高温津贴复核记录.md, source_type: policy}
    entities:
      - {id: b1, name: 高温津贴, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: monthly_subsidy_cny, value: 200, value_type: number, source: d1, observed_at: 2025-07-15}
    expected_drifts:
      - {type: possibly_stale, subject: b1, predicate: monthly_subsidy_cny, severity: warning}

  - id: stale_possibly_pricing_midyear_change_over_threshold
    title: 年中生效的开放式价格（非年初年度费率）超 pricing 阈值仍报疑似
    category: positive
    as_of: 2026-10-06
    rules:
      pricing_stale_days: 90
    documents:
      - {id: d1, filename: 促销活动价格_2026Q2.md, source_type: pricing}
    entities:
      - {id: p1, name: 延保服务促销价, type: product}
    facts:
      - {id: f1, subject: p1, predicate: promo_price_cny, value: 99, value_type: number, source: d1, valid_from: 2026-06-01}
    expected_drifts:
      - {type: possibly_stale, subject: p1, predicate: promo_price_cny, severity: warning}

  - id: stale_possibly_pricing_prior_year_annual_rate
    title: 上一年度生效的开放式年度费率跨入新年度后，超 pricing 阈值应报疑似
    category: positive
    as_of: 2027-02-10
    rules:
      pricing_stale_days: 90
    documents:
      - {id: d1, filename: 实施服务费标准_2026.md, source_type: pricing}
    entities:
      - {id: p1, name: 实施服务人天单价, type: service}
    facts:
      - {id: f1, subject: p1, predicate: daily_rate_cny, value: 1200, value_type: number, source: d1, valid_from: 2026-01-01}
    expected_drifts:
      - {type: possibly_stale, subject: p1, predicate: daily_rate_cny, severity: warning}

  # ---- fact-extract-v6：valid_to 来源分档（降级可见，不阻断） ------------
  - id: stale_possibly_calendar_derived_expiry
    title: 截止日期由周期标签推算（正文不含该日期），过期也只报疑似不阻断
    category: positive
    as_of: 2026-10-07
    documents:
      - {id: d1, filename: 办公用品领用目录_2026Q3.xlsx, source_type: corporate}
    entities:
      - {id: s1, name: 白板笔, type: supply}
    facts:
      # 模型从标题“2026年第三季度”脑补 09-30；行事实自身无任何日期信号，
      # 但过期仍必须可见（possibly），不能因无年龄信号而静默。
      - {id: f1, subject: s1, predicate: 领用单价, value: 3.5, value_type: number, source: d1, valid_to: 2026-09-30, valid_to_anchor: calendar_derived}
    expected_drifts:
      - {type: possibly_stale, subject: s1, predicate: 领用单价, severity: warning}

  - id: stale_possibly_document_scope_expiry
    title: 截止日期来自文档抬头有效期声明（不在该事实 quote 内），降级为疑似
    category: positive
    as_of: 2026-10-07
    documents:
      - {id: d1, filename: 差旅管理办法_2025版.pdf, source_type: policy}
    entities:
      - {id: t1, name: 市内交通补贴, type: policy}
    facts:
      - {id: f1, subject: t1, predicate: daily_traffic_cny, value: 80, value_type: number, source: d1, valid_to: 2026-06-30, valid_to_anchor: document_scope}
    expected_drifts:
      - {type: possibly_stale, subject: t1, predicate: daily_traffic_cny, severity: warning}

  - id: stale_possibly_inferred_expiry_beats_fresh_age
    title: 推断有效期已过时，即使最近仍被观测（年龄未超阈值）也报疑似
    category: positive
    as_of: 2026-10-07
    documents:
      - {id: d1, filename: 季度促销页_2026Q3.md, source_type: pricing}
    entities:
      - {id: p1, name: 满减促销位, type: product}
    facts:
      - {id: f1, subject: p1, predicate: promo_price, value: 199, value_type: number, source: d1, observed_at: 2026-09-20, valid_to: 2026-09-30, valid_to_anchor: calendar_derived}
    expected_drifts:
      - {type: possibly_stale, subject: p1, predicate: promo_price, severity: warning}

  - id: stale_confirmed_quoted_anchor_expiry
    title: 截止日期逐字出现在事实自身证据中（quoted），过期仍确定性报 confirmed
    category: positive
    as_of: 2026-10-07
    documents:
      - {id: d1, filename: 夏季促销通知.md, source_type: policy}
    entities:
      - {id: c1, name: 夏日满减活动, type: campaign}
    facts:
      - {id: f1, subject: c1, predicate: discount_rate, value: 0.85, value_type: number, source: d1, valid_to: 2026-09-30, valid_to_anchor: quoted}
    expected_drifts:
      - {type: confirmed_stale, subject: c1, predicate: discount_rate, severity: medium}

  # ---- Negative：不该报警 -----------------------------------------------
  - id: stale_neg_inferred_anchor_not_yet_expired
    title: 推算的截止日期尚未到期且无年龄信号，不报警（推断档也不凭空升级）
    category: negative
    as_of: 2026-10-07
    documents:
      - {id: d1, filename: 办公用品领用目录_2026Q4.xlsx, source_type: corporate}
    entities:
      - {id: s1, name: 复印纸, type: supply}
    facts:
      - {id: f1, subject: s1, predicate: 领用单价, value: 25, value_type: number, source: d1, valid_to: 2026-12-31, valid_to_anchor: calendar_derived}
    expected_drifts: []

  - id: stale_neg_no_age_signal
    title: 完全没有年龄信号的事实绝不猜过期
    category: negative
    documents:
      - {id: d1, filename: 通用术语表.md, source_type: general, parsed_at: 2020-01-01}
    entities:
      - {id: x1, name: 工单状态, type: concept}
    facts:
      - {id: f1, subject: x1, predicate: definition, value: 工单从创建到关闭的全过程, value_type: string, source: d1}
    expected_drifts: []

  - id: stale_neg_age_under_threshold
    title: 92 天未复核，未到 365 天阈值
    category: negative
    documents:
      - {id: d1, filename: 本季服务说明.md, source_type: general}
    entities:
      - {id: s1, name: 上门安装服务, type: service}
    facts:
      - {id: f1, subject: s1, predicate: response_hours, value: 24, value_type: number, source: d1, observed_at: 2026-03-01}
    expected_drifts: []

  - id: stale_neg_valid_to_equals_as_of_boundary
    title: valid_to 恰等于评估日（严格小于才过期），不报
    category: negative
    documents:
      - {id: d1, filename: 当期政策.md, source_type: policy}
    entities:
      - {id: b1, name: 高温补贴政策, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: subsidy_cny, value: 200, value_type: number, source: d1, valid_to: 2026-06-01}
    expected_drifts: []

  - id: stale_superseded_edition_only_metadata_emits_doc_card
    title: 已废版本只剩不可变元数据时，仅出文档级 superseded 卡，不对事实报警
    category: positive
    as_of: 2026-10-06
    documents:
      - {id: dold, filename: 报价单_2024.pdf, source_type: corporate}
      - {id: dnew, filename: 报价单_2026.pdf, source_type: corporate, previous_version_of: dold}
    entities:
      - {id: p1, name: 云客服专业版, type: product}
    facts:
      - {id: f_code, subject: p1, predicate: 产品编码, value: YKF-PRO-2024, value_type: string, source: dold}
    expected_drifts:
      - {type: superseded, severity: medium, old_source: 报价单_2024.pdf, new_source: 报价单_2026.pdf}

  - id: stale_neg_metadata_aged_silent
    title: 文件编号/生效日期等单据元事实超龄也不报 possibly_stale
    category: negative
    documents:
      - {id: d1, filename: 服务SLA_2021.md, source_type: policy}
    entities:
      - {id: b1, name: 客户服务SLA, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: 文件编号, value: SLA-2021-001, value_type: string, source: d1, observed_at: 2021-03-01}
    expected_drifts: []

  - id: stale_superseded_edition_metadata_silent_business_reports
    title: 同一已废版本上元数据静默、业务条款照报（抑制互不连坐）
    category: positive
    as_of: 2026-10-06
    documents:
      - {id: dold, filename: 报价单_2024.pdf, source_type: corporate}
      - {id: dnew, filename: 报价单_2026.pdf, source_type: corporate, previous_version_of: dold}
    entities:
      - {id: p1, name: 云客服专业版, type: product}
    facts:
      - {id: f_code, subject: p1, predicate: 产品编码, value: YKF-PRO-2024, value_type: string, source: dold}
      - {id: f_price, subject: p1, predicate: list_price, value: 19800, value_type: number, source: dold}
    expected_drifts:
      - {type: confirmed_stale, subject: p1, predicate: list_price, severity: medium, old_source: 报价单_2024.pdf, new_source: 报价单_2026.pdf}
      - {type: superseded, severity: medium, old_source: 报价单_2024.pdf, new_source: 报价单_2026.pdf}

  # ---- Ambiguous Negative：看似该报，实则不应报 --------------------------
  - id: stale_amb_old_document_fresh_fact
    title: 文档很旧但事实最近仍被观测，知识并未老化
    category: ambiguous_negative
    documents:
      - {id: d1, filename: 长期有效的服务章程.md, source_type: general, parsed_at: 2019-01-01}
    entities:
      - {id: s1, name: 贵宾接待规范, type: service}
    facts:
      - {id: f1, subject: s1, predicate: greeting_rule, value: 主动问好并奉茶, value_type: string, source: d1, observed_at: 2026-05-15}
    expected_drifts: []

  - id: stale_amb_old_valid_from_recent_review
    title: 生效很早但最近复核确认仍有效，不因起始早就报疑似
    category: ambiguous_negative
    documents:
      - {id: d1, filename: 安全红线制度.md, source_type: policy}
    entities:
      - {id: b1, name: 动火作业规范, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: require_permit, value: true, value_type: boolean, source: d1, valid_from: 2020-01-01, observed_at: 2026-05-10}
    expected_drifts: []

  - id: stale_amb_pricing_within_configured_grace
    title: 价格来源 182 天，但配置给予 365 天宽限，未超期
    category: ambiguous_negative
    rules:
      pricing_stale_days: 365
    documents:
      - {id: d1, filename: 稳定定价表.csv, source_type: pricing}
    entities:
      - {id: p1, name: 延保服务, type: product}
    facts:
      - {id: f1, subject: p1, predicate: warranty_ext_price, value: 99, value_type: number, source: d1, observed_at: 2025-12-01}
    expected_drifts: []

  - id: stale_amb_current_chain_edition_not_stale
    title: 版本链中最新版手册的条款即便发布超 365 天也不报疑似（现行版本不因年长而过期）
    category: ambiguous_negative
    as_of: 2026-10-06
    documents:
      - {id: dcur, filename: 员工手册_2025.md, source_type: policy, group: employee_handbook}
    entities:
      - {id: b1, name: 保密义务条款, type: policy}
    facts:
      - {id: f1, subject: b1, predicate: must_keep_confidential, value: 公司商业秘密, value_type: string, source: dcur, valid_from: 2025-07-01}
    expected_drifts: []

  - id: stale_amb_annual_rate_within_edition_year
    title: 开放式年度费率自年初生效且无失效日，在其适用年内即便超 90 天也不报疑似
    category: ambiguous_negative
    as_of: 2026-10-06
    rules:
      pricing_stale_days: 90
    documents:
      - {id: d1, filename: 实施服务费标准.md, source_type: pricing}
    entities:
      - {id: p1, name: 实施服务人天单价, type: service}
    facts:
      - {id: f1, subject: p1, predicate: daily_rate_cny, value: 1200, value_type: number, source: d1, valid_from: 2026-01-01}
    expected_drifts: []

  # ---- R16：现行文档逐字复用已失效值（design 04 §11，确定性） -------------
  - id: stale_reused_value_previous_edition
    title: R16-14 现行经销单逐字采用上一版失效价且与链头现值不同，报引用失效值
    category: positive
    as_of: 2026-10-06
    documents:
      - {id: d2025, filename: 价目表_2025.xlsx, source_type: corporate, group: price}
      - {id: d2026, filename: 价目表_2026.xlsx, source_type: corporate, group: price, previous_version_of: d2025}
      - {id: dchannel, filename: 经销渠道报价单_2026H2.pdf, source_type: corporate}
    entities:
      - {id: p1, name: 云客服专业版, type: product}
    facts:
      - {id: f_old, subject: p1, predicate: list_price, value: 22800, value_type: number, source: d2025, valid_to: 2025-12-31, measure_unit: "元/年·企业"}
      - {id: f_head, subject: p1, predicate: list_price, value: 23800, value_type: number, source: d2026, valid_from: 2026-01-01, measure_unit: "元/年·企业"}
      - {id: f_cur, subject: p1, predicate: 渠道结算价, value: 22800, value_type: number, source: dchannel, valid_from: 2026-07-01, valid_to: 2026-12-31, measure_unit: "元/年·企业"}
    expected_drifts:
